server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  index index.html;

  # Try the URL as-is, then with /index.html appended (Starlight emits one
  # index.html per page directory), then a final fallback to /index.html
  # so unknown paths get the static 404 page rather than nginx's default.
  #
  # HTML is NOT fingerprinted, so it must always be revalidated. Without
  # this, browsers heuristically cache pages and keep showing a stale
  # sidebar/nav (e.g. a doc page added later won't appear on pages the
  # user already visited) until the cache expires. `no-cache` lets the
  # browser keep a copy but forces an ETag/Last-Modified revalidation on
  # every navigation — a 304 when unchanged, fresh HTML when it changed.
  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
    add_header Cache-Control "no-cache";
  }

  # Cache fingerprinted static assets aggressively. This regex location
  # takes precedence over `location /`, so JS/CSS/etc. keep the long
  # immutable cache while HTML stays revalidated.
  location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
